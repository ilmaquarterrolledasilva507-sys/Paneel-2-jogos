DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minhas Rifas Online</title>
    <style>
        body { font-family: sans-serif; padding: 20px; background-color: #f4f4f9; }
        h1 { text-align: center; color: #333; }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 20px; }
        .card { background: white; padding: 15px; border-radius: 10px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); text-align: center; }
        .card img { width: 100%; height: 200px; object-fit: cover; border-radius: 8px; }
        .btn { background-color: #007bff; color: white; padding: 10px 20px; text-decoration: none; display: inline-block; margin-top: 10px; border-radius: 5px; }
    </style>
</head>
<body>
    <h1>🎟️ Sorteios Ativos</h1>
    <div class="grid" id="listaRifas"></div>
    
    <script>
        function carregarRifas() {
            let container = document.getElementById('listaRifas');
            let rifas = JSON.parse(localStorage.getItem('rifas')) || [];
            container.innerHTML = '';
            if(rifas.length === 0) {
                container.innerHTML = '<p style="text-align:center; width:100%">Nenhuma rifa cadastrada ainda.</p>';
                return;
            }
            rifas.forEach(r => {
                let div = document.createElement('div');
                div.className = 'card';
                div.innerHTML = `
                    <img src="${r.imagem}">
                    <h3>${r.titulo}</h3>
                    <p>Preço: ${r.preco}</p>
                    <p>Restam: ${r.total - r.vendidos.length} números</p>
                    <a href="#" class="btn">Comprar</a>
                `;
                container.appendChild(div);
            });
        }
        window.onload = carregarRifas;
    </script>
</body>
